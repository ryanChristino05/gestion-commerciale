name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurer les dépendances
        run: dotnet restore GestionCommerciale.Api/GestionCommerciale.Api.csproj

      - name: Build de l'API
        run: dotnet build GestionCommerciale.Api/GestionCommerciale.Api.csproj --no-restore --configuration Release

      - name: Lancer les tests
        run: dotnet test GestionCommerciale.Tests/GestionCommerciale.Tests.csproj --configuration Release --verbosity normal

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Déclencher le déploiement sur Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"